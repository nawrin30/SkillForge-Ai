<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillForge Profile"><title>Profile | SkillForge</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body data-page="profile">
<div id="appShell" class="app-shell">
<aside id="sidebar" class="sidebar"></aside>
<div class="app-main"><header class="topbar"><button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">☰</button><div class="topbar-title"><span class="eyebrow">SKILLFORGE WORKSPACE</span><h1>Profile</h1></div><div class="topbar-actions"><button id="themeButton" class="icon-btn" title="Toggle theme">☾</button><button id="logoutButton" class="btn btn-secondary btn-sm">Logout</button></div></header>
<main class="content"><div class="page-intro"><div><h2>Profile</h2><p>Build a professional profile that represents your career direction.</p></div></div><div class="profile-layout"><div class="card profile-card"><div class="avatar-xl" id="profileAvatar">NT</div><h2 id="profileDisplayName">Your Name</h2><p id="profileCareer">Software Engineering Student</p><div class="profile-links"><span id="profileGithub">GitHub</span><span id="profileLinkedin">LinkedIn</span></div></div><div class="card"><div class="card-heading"><div><h3>Profile Information</h3><p>Stored locally in your browser.</p></div></div><form id="profileForm" class="form-grid"><label>Name<input id="profileName" required></label><label>University<input id="profileUniversity"></label><label>Department<input id="profileDepartment"></label><label>Semester<input id="profileSemester"></label><label>Career goal<input id="profileCareerGoal"></label><label>GitHub URL<input id="profileGithubInput" type="url"></label><label>LinkedIn URL<input id="profileLinkedinInput" type="url"></label><label class="full">Bio<textarea id="profileBio" rows="5"></textarea></label><label class="full">Skills (comma separated)<input id="profileSkills"></label><div class="form-actions"><button class="btn btn-primary">Save Profile</button></div></form></div></div></main>
<footer class="app-footer">SkillForge • Local-first career development workspace</footer></div></div>
<div id="toastContainer" class="toast-container"></div>
<script src="js/app.js"></script></body></html>
