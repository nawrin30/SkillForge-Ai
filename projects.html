<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillForge Projects"><title>Projects | SkillForge</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body data-page="projects">
<div id="appShell" class="app-shell">
<aside id="sidebar" class="sidebar"></aside>
<div class="app-main"><header class="topbar"><button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">☰</button><div class="topbar-title"><span class="eyebrow">SKILLFORGE WORKSPACE</span><h1>Projects</h1></div><div class="topbar-actions"><button id="themeButton" class="icon-btn" title="Toggle theme">☾</button><button id="logoutButton" class="btn btn-secondary btn-sm">Logout</button></div></header>
<main class="content"><div class="page-intro"><div><h2>Projects</h2><p>Turn learning into portfolio evidence with projects you can show.</p></div></div><div class="toolbar card"><div class="search-box"><span>⌕</span><input id="projectSearch" placeholder="Search projects..."></div><select id="projectStatusFilter"><option value="">All statuses</option><option>Planning</option><option>In Progress</option><option>Completed</option></select><button class="btn btn-primary" data-modal="projectModal">+ Add Project</button></div><div id="projectsList" class="card-grid"></div>
<div id="projectModal" class="modal"><div class="modal-card"><button class="modal-close">×</button><h2>Add Project</h2><form id="projectForm" class="form-grid"><input type="hidden" id="projectId"><label>Project name<input id="projectName" required></label><label>Technology used<input id="projectTech" placeholder="HTML, CSS, JavaScript"></label><label>Status<select id="projectStatus"><option>Planning</option><option>In Progress</option><option>Completed</option></select></label><label>Start date<input id="projectStart" type="date"></label><label>Completion date<input id="projectCompletion" type="date"></label><label>GitHub URL<input id="projectGithub" type="url" placeholder="https://github.com/..."></label><label>Live demo URL<input id="projectLive" type="url" placeholder="https://..."></label><label class="full">Description<textarea id="projectDescription" rows="3"></textarea></label><div class="form-actions"><button type="button" class="btn btn-secondary modal-cancel">Cancel</button><button class="btn btn-primary">Save Project</button></div></form></div></div></main>
<footer class="app-footer">SkillForge • Local-first career development workspace</footer></div></div>
<div id="toastContainer" class="toast-container"></div>
<script src="js/app.js"></script><script src="js/projects.js"></script></body></html>
