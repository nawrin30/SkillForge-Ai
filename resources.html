<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillForge Learning Resources"><title>Learning Resources | SkillForge</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body data-page="resources">
<div id="appShell" class="app-shell">
<aside id="sidebar" class="sidebar"></aside>
<div class="app-main"><header class="topbar"><button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">☰</button><div class="topbar-title"><span class="eyebrow">SKILLFORGE WORKSPACE</span><h1>Learning Resources</h1></div><div class="topbar-actions"><button id="themeButton" class="icon-btn" title="Toggle theme">☾</button><button id="logoutButton" class="btn btn-secondary btn-sm">Logout</button></div></header>
<main class="content"><div class="page-intro"><div><h2>Learning Resources</h2><p>Keep useful tutorials, documentation, books and practice links in one library.</p></div></div><div class="toolbar card"><div class="search-box"><span>⌕</span><input id="resourceSearch" placeholder="Search resources..."></div><select id="resourceTypeFilter"><option value="">All types</option><option>Website</option><option>YouTube</option><option>Documentation</option><option>Book</option><option>Article</option><option>Practice</option></select><button class="btn btn-primary" data-modal="resourceModal">+ Add Resource</button></div><div id="resourcesList" class="card-grid"></div>
<div id="resourceModal" class="modal"><div class="modal-card"><button class="modal-close">×</button><h2>Add Resource</h2><form id="resourceForm" class="form-grid"><input type="hidden" id="resourceId"><label>Title<input id="resourceTitle" required></label><label>Type<select id="resourceType"><option>Website</option><option>YouTube</option><option>Documentation</option><option>Book</option><option>Article</option><option>Practice</option></select></label><label>Category<input id="resourceCategory" required></label><label>URL<input id="resourceUrl" type="url" placeholder="https://..." required></label><label class="full">Description<textarea id="resourceDescription" rows="3"></textarea></label><div class="form-actions"><button type="button" class="btn btn-secondary modal-cancel">Cancel</button><button class="btn btn-primary">Save Resource</button></div></form></div></div></main>
<footer class="app-footer">SkillForge • Local-first career development workspace</footer></div></div>
<div id="toastContainer" class="toast-container"></div>
<script src="js/app.js"></script><script src="js/resources.js"></script></body></html>
