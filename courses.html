<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillForge Courses"><title>Courses | SkillForge</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body data-page="courses">
<div id="appShell" class="app-shell">
<aside id="sidebar" class="sidebar"></aside>
<div class="app-main"><header class="topbar"><button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">☰</button><div class="topbar-title"><span class="eyebrow">SKILLFORGE WORKSPACE</span><h1>Courses</h1></div><div class="topbar-actions"><button id="themeButton" class="icon-btn" title="Toggle theme">☾</button><button id="logoutButton" class="btn btn-secondary btn-sm">Logout</button></div></header>
<main class="content"><div class="page-intro"><div><h2>Courses</h2><p>Track structured learning from start to completion.</p></div></div><div class="toolbar card"><div class="search-box"><span>⌕</span><input id="courseSearch" placeholder="Search courses..."></div><select id="courseStatusFilter"><option value="">All statuses</option><option>Not Started</option><option>In Progress</option><option>Completed</option></select><select id="courseSort"><option value="progress">Progress</option><option value="title">Title A → Z</option><option value="date">Target date</option></select><button class="btn btn-primary" data-modal="courseModal">+ Add Course</button></div><div id="coursesList" class="card-grid"></div>
<div id="courseModal" class="modal"><div class="modal-card"><button class="modal-close">×</button><h2>Add Course</h2><form id="courseForm" class="form-grid"><input type="hidden" id="courseId"><label>Course title<input id="courseTitle" required></label><label>Platform<input id="coursePlatform" required></label><label>Instructor<input id="courseInstructor"></label><label>Category<input id="courseCategory" placeholder="Web Development"></label><label>Start date<input id="courseStart" type="date"></label><label>Target completion<input id="courseTarget" type="date"></label><label>Progress %<input id="courseProgress" type="number" min="0" max="100" value="0"></label><label>Status<select id="courseStatus"><option>Not Started</option><option>In Progress</option><option>Completed</option></select></label><div class="form-actions"><button type="button" class="btn btn-secondary modal-cancel">Cancel</button><button class="btn btn-primary">Save Course</button></div></form></div></div></main>
<footer class="app-footer">SkillForge • Local-first career development workspace</footer></div></div>
<div id="toastContainer" class="toast-container"></div>
<script src="js/app.js"></script><script src="js/courses.js"></script></body></html>
