<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillForge My Skills"><title>My Skills | SkillForge</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body data-page="skills">
<div id="appShell" class="app-shell">
<aside id="sidebar" class="sidebar"></aside>
<div class="app-main"><header class="topbar"><button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">☰</button><div class="topbar-title"><span class="eyebrow">SKILLFORGE WORKSPACE</span><h1>My Skills</h1></div><div class="topbar-actions"><button id="themeButton" class="icon-btn" title="Toggle theme">☾</button><button id="logoutButton" class="btn btn-secondary btn-sm">Logout</button></div></header>
<main class="content"><div class="page-intro"><div><h2>My Skills</h2><p>Track the abilities that move your career forward.</p></div></div><div class="toolbar card"><div class="search-box"><span>⌕</span><input id="skillSearch" placeholder="Search skills..."></div><select id="skillCategoryFilter"><option value="">All categories</option><option>Programming</option><option>Web Development</option><option>Database</option><option>Tools</option><option>Soft Skills</option><option>Other</option></select><select id="skillSort"><option value="progress-desc">Progress: High → Low</option><option value="progress-asc">Progress: Low → High</option><option value="name">Name A → Z</option></select><button class="btn btn-primary" data-modal="skillModal">+ Add Skill</button></div><div id="skillsList" class="card-grid"></div>
<div id="skillModal" class="modal"><div class="modal-card"><button class="modal-close">×</button><h2 id="skillModalTitle">Add Skill</h2><form id="skillForm" class="form-grid"><input type="hidden" id="skillId"><label>Skill name<input id="skillName" required></label><label>Category<select id="skillCategory" required><option>Programming</option><option>Web Development</option><option>Database</option><option>Tools</option><option>Soft Skills</option><option>Other</option></select></label><label>Level<select id="skillLevel"><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Expert</option></select></label><label>Progress %<input id="skillProgress" type="number" min="0" max="100" value="50" required></label><label>Last practiced<input id="skillPractice" type="date"></label><div class="form-actions"><button type="button" class="btn btn-secondary modal-cancel">Cancel</button><button class="btn btn-primary">Save Skill</button></div></form></div></div></main>
<footer class="app-footer">SkillForge • Local-first career development workspace</footer></div></div>
<div id="toastContainer" class="toast-container"></div>
<script src="js/app.js"></script><script src="js/skills.js"></script></body></html>
