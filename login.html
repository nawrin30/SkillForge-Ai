<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login | SkillForge</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body class="auth-page">
<div class="auth-shell"><a class="brand auth-brand" href="index.html"><span class="brand-mark">SF</span><span>SkillForge</span></a>
<div class="auth-card card"><div class="auth-header"><span class="eyebrow">WELCOME BACK</span><h1>Continue your career journey.</h1><p>Sign in to access your personal SkillForge workspace.</p></div>
<form id="loginForm" class="form-stack"><label>Email<input id="loginEmail" type="email" placeholder="you@example.com" required></label><label>Password<div class="password-wrap"><input id="loginPassword" type="password" placeholder="Minimum 6 characters" minlength="6" required><button type="button" class="password-toggle" data-target="loginPassword">Show</button></div></label><label class="check-row"><input id="rememberMe" type="checkbox" checked><span>Remember me</span></label><button class="btn btn-primary btn-block" type="submit">Login to SkillForge</button></form>
<div class="demo-box"><b>Demo account</b><span>Use any valid email and a password with 6+ characters.</span></div><p class="auth-foot">New here? <a href="index.html">Explore SkillForge</a></p></div></div>
<script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
