<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillForge Goals"><title>Goals | SkillForge</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body data-page="goals">
<div id="appShell" class="app-shell">
<aside id="sidebar" class="sidebar"></aside>
<div class="app-main"><header class="topbar"><button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">☰</button><div class="topbar-title"><span class="eyebrow">SKILLFORGE WORKSPACE</span><h1>Goals</h1></div><div class="topbar-actions"><button id="themeButton" class="icon-btn" title="Toggle theme">☾</button><button id="logoutButton" class="btn btn-secondary btn-sm">Logout</button></div></header>
<main class="content"><div class="page-intro"><div><h2>Goals</h2><p>Set daily, weekly, monthly and career goals, then keep them moving.</p></div></div><div class="toolbar card"><div class="search-box"><span>⌕</span><input id="goalSearch" placeholder="Search goals..."></div><select id="goalTypeFilter"><option value="">All types</option><option>Daily</option><option>Weekly</option><option>Monthly</option><option>Career</option></select><select id="goalStatusFilter"><option value="">All statuses</option><option>Active</option><option>Completed</option></select><button class="btn btn-primary" data-modal="goalModal">+ Add Goal</button></div><div id="goalsList" class="card-grid"></div>
<div id="goalModal" class="modal"><div class="modal-card"><button class="modal-close">×</button><h2>Add Goal</h2><form id="goalForm" class="form-grid"><input type="hidden" id="goalId"><label>Title<input id="goalTitle" required></label><label>Type<select id="goalType"><option>Daily</option><option>Weekly</option><option>Monthly</option><option>Career</option></select></label><label>Deadline<input id="goalDeadline" type="date" required></label><label>Priority<select id="goalPriority"><option>Low</option><option>Medium</option><option>High</option></select></label><label>Progress %<input id="goalProgress" type="number" min="0" max="100" value="0"></label><label>Status<select id="goalStatus"><option>Active</option><option>Completed</option></select></label><div class="form-actions"><button type="button" class="btn btn-secondary modal-cancel">Cancel</button><button class="btn btn-primary">Save Goal</button></div></form></div></div></main>
<footer class="app-footer">SkillForge • Local-first career development workspace</footer></div></div>
<div id="toastContainer" class="toast-container"></div>
<script src="js/app.js"></script><script src="js/goals.js"></script></body></html>
