<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="SkillForge Certificates"><title>Certificates | SkillForge</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body data-page="certificates">
<div id="appShell" class="app-shell">
<aside id="sidebar" class="sidebar"></aside>
<div class="app-main"><header class="topbar"><button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar">☰</button><div class="topbar-title"><span class="eyebrow">SKILLFORGE WORKSPACE</span><h1>Certificates</h1></div><div class="topbar-actions"><button id="themeButton" class="icon-btn" title="Toggle theme">☾</button><button id="logoutButton" class="btn btn-secondary btn-sm">Logout</button></div></header>
<main class="content"><div class="page-intro"><div><h2>Certificates</h2><p>Keep your professional credentials organized and ready to share.</p></div></div><div class="toolbar card"><div class="search-box"><span>⌕</span><input id="certificateSearch" placeholder="Search certificates..."></div><input id="certificateCategoryFilter" placeholder="Filter category"><button class="btn btn-primary" data-modal="certificateModal">+ Add Certificate</button></div><div id="certificatesList" class="card-grid"></div>
<div id="certificateModal" class="modal"><div class="modal-card"><button class="modal-close">×</button><h2>Add Certificate</h2><form id="certificateForm" class="form-grid"><input type="hidden" id="certificateId"><label>Certificate name<input id="certificateName" required></label><label>Platform<input id="certificatePlatform" required></label><label>Issuer<input id="certificateIssuer"></label><label>Issue date<input id="certificateDate" type="date"></label><label>Credential ID<input id="certificateCredential"></label><label>Credential URL<input id="certificateUrl" type="url"></label><label class="full">Skill / category<input id="certificateCategory"></label><div class="form-actions"><button type="button" class="btn btn-secondary modal-cancel">Cancel</button><button class="btn btn-primary">Save Certificate</button></div></form></div></div></main>
<footer class="app-footer">SkillForge • Local-first career development workspace</footer></div></div>
<div id="toastContainer" class="toast-container"></div>
<script src="js/app.js"></script><script src="js/certificates.js"></script></body></html>
